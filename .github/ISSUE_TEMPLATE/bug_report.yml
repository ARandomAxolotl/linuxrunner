name: Bug report
description: Report a reproducible LinuxRunner problem.
title: "[Bug] "
body:
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Device model, iOS or iPadOS version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LinuxRunner version and build
      description: Settings → About LinuxRunner. Include source revision or IPA checksum if known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution, package and desktop
      placeholder: Distribution/version, affected package/version, desktop and graphics mode
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Steps, expected behavior, actual behavior and the first relevant error.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: Review exports for private information. Do not attach credentials, personal messages or signing material. Report vulnerabilities through the private security form.
