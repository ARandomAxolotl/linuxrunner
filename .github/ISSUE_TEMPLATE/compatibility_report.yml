name: Application compatibility
description: Share what actually works or fails in a Linux application.
title: "[Compatibility] "
body:
  - type: input
    id: application
    attributes:
      label: Application and package version
    validations:
      required: true
  - type: input
    id: configuration
    attributes:
      label: Device, OS, LinuxRunner version/build and distribution
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Launches successfully
        - Basic interaction tested
        - Specific features tested (describe below)
        - Experimental or partially working
        - Fails to launch or crashes
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Actions tested and limitations
      description: List actual operations, duration if relevant, graphics/input configuration and reproduction steps. A launch is not a full compatibility test. Review logs and images for personal data before sharing.
    validations:
      required: true
