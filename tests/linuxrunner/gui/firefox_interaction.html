<!doctype html><meta charset="utf-8"><title>LinuxRunner Firefox input and repaint contract</title>
<style>
body{margin:16px;background:#172433;color:white;font:24px sans-serif}
#marker{position:fixed;top:16px;left:16px;display:flex;z-index:10}
#marker i{display:block;width:32px;height:40px;background:rgb(230,30,70)}
#marker i:nth-child(2){background:rgb(10,220,190)}
#marker.odd i{background:rgb(15,60,230)}
#marker.odd i:nth-child(2){background:rgb(230,200,10)}
section{height:1400px;background:linear-gradient(#173c58,#172433)}
</style>
<div id="marker"><i></i><i></i><i></i></div>
<h1 style="margin-top:90px">Original Firefox input and visible repaint</h1>
<p id="count">Delivered events: 0</p><section>Long scrolling page</section><h2>Bottom</h2>
<script>
let n=0;const marker=document.getElementById('marker');
function paint(){marker.classList.toggle('odd',++n%2!==0);document.getElementById('count').textContent='Delivered events: '+n;}
// The harness sends one acknowledged event at a time. Wheel events retain
// normal scrolling; the fixed marker confirms delivery AND visible repaint.
addEventListener('keydown',e=>{if(e.key==='q'){e.preventDefault();paint();}});
addEventListener('wheel',paint,{passive:true});
</script>
