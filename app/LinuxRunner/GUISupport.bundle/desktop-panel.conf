Global {
 edge=bottom
 allign=center
 margin=8
 widthtype=percent
 width=100
 height=42
 transparent=0
 tintcolor=#15243a
 alpha=255
 setdocktype=1
 setpartialstrut=1
 usefontcolor=1
 fontcolor=#eaf2ff
 usefontsize=1
 fontsize=11
 iconsize=26
 background=0
}
Plugin {
 type=menu
 Config {
  image=distributor-logo
  name=Applications
  system {
  }
 }
}
Plugin {
 type=launchbar
 Config {
  Button {
   id=/usr/share/applications/pcmanfm.desktop
  }
  Button {
   id=/usr/share/applications/debian-xterm.desktop
  }
 }
}
Plugin {
 type=taskbar
 expand=1
 Config {
  tooltips=1
  IconsOnly=0
  ShowAllDesks=0
  UseMouseWheel=1
  ShowSquareBrackets=0
  MaxTaskWidth=180
  spacing=2
 }
}
Plugin {
 type=dclock
 Config {
  ClockFmt=%H:%M
  TooltipFmt=%A %d %B
  BoldFont=0
 }
}
