<!doctype html><meta charset="utf-8"><title>LinuxRunner Chromium compatibility</title>
<style>body{font:18px sans-serif;background:#d9f7ea;margin:24px}input,button{font:inherit}section{height:700px}#result{background:white;padding:15px}</style>
<h1>REAL LINUX ARM64 CHROMIUM</h1><p>Local HTML/CSS, JavaScript, forms, links, scrolling and storage probe.</p>
<input id="text" placeholder="Type here"><button onclick="document.querySelector('#result').textContent='clicked '+(++window.clicks)+' '+document.querySelector('#text').value">Count</button><p id="result">Waiting</p>
<a href="https://example.com">HTTPS example.com</a> | <a href="browser-test.html?navigation=1">Local navigation</a>
<script>window.clicks=0;console.log('LR_PREVIOUS_STORAGE',localStorage.getItem('linuxrunner'),document.cookie);localStorage.setItem('linuxrunner','storage-ok');document.cookie='linuxrunner=cookie-ok;SameSite=Lax;Max-Age=3600';document.querySelector('#result').textContent='JavaScript '+(1+2)+' '+localStorage.getItem('linuxrunner');document.querySelector('#result').style.backgroundColor='#fff59d';console.log('LR_JS_PASS',document.title,localStorage.getItem('linuxrunner'),document.cookie);</script>
<section>Scroll down to the green bottom marker.</section><h2>SCROLL BOTTOM</h2>

<script>document.querySelector('#text').addEventListener('input',e=>console.log('LR_INPUT',e.target.value));document.querySelector('button').addEventListener('click',()=>console.log('LR_CLICK',document.querySelector('#result').textContent));let reported=false;window.addEventListener('scroll',()=>{if(scrollY>500&&!reported){reported=true;console.log('LR_SCROLL_PASS',scrollY);}});</script>
