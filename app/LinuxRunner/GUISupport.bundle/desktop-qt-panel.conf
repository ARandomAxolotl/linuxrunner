# Dedicated LinuxRunner session; does not replace ~/.config/lxqt/panel.conf.
panels=panel1
[panel1]
plugins=menu,taskbar,worldclock,showdesktop
position=Bottom
desktop=0
width=100
width-percent=true
panelSize=36
background-color=#e8edf3
font-color=#17283b
opacity=100
iconSize=24
alignment=Left
reserve-space=true
hidable=false
[menu]
showText=true
text=Apps
type=fancymenu
alignment=Left
[taskbar]
type=taskbar
alignment=Left
buttonWidth=180
groupingEnabled=false
[worldclock]
type=worldclock
alignment=Right
[showdesktop]
type=showdesktop
alignment=Right
